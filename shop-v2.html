<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C.P.A.W.jp | Shop</title><link rel="stylesheet" href="cpaw-v2.css"></head><body><header><a class="brand" href="index.html">C.P.A.W.jp</a><div class="actions"><a href="index.html" class="small">HOME</a><button id="toggle" class="secondary">English</button></div></header><main class="wrap"><span class="pill">JAPANESE PRODUCTS FOR THE WORLD</span><h1 id="headline">日本の商品を、世界へ。</h1><p id="intro" class="muted">商品・送料・配送対象国をご確認ください。</p><div class="notice topgap" id="status">商品を読み込み中…</div><section class="grid topgap" id="items"></section></main><footer><a href="index.html">トップ</a><a href="legal.html">特定商取引法に基づく表記</a><a href="privacy.html">プライバシーポリシー</a><a href="terms.html">利用規約</a><a href="shipping-returns.html">配送・返品</a></footer><script>
let lang=new URLSearchParams(location.search).get('lang')==='en'?'en':'ja';let products=[];const el=id=>document.getElementById(id);const tr=(a,b)=>lang==='ja'?a:b;function safeURL(v){try{let u=new URL(v,location.href);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}}function node(tag,cls,txt){let n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}function render(){document.documentElement.lang=lang;el('toggle').textContent=lang==='ja'?'English':'日本語';el('headline').textContent=tr('日本の商品を、世界へ。','Japanese products, worldwide.');el('intro').textContent=tr('商品・送料・配送対象国をご確認ください。','Please check product details, shipping fees and eligible destinations.');el('items').replaceChildren();let active=products.filter(x=>['published','coming_soon'].includes(x.status));el('status').textContent=active.length?tr(active.length+'件の商品を掲載中',active.length+' products listed'):tr('商品は現在準備中です。','Products are coming soon.');for(let p of active){let card=node('article','card'),v=node('div','visual'),url=safeURL(p.image_url||'');if(url){let img=node('img');img.src=url;img.alt=tr(p.name_ja,p.name_en)||'';img.loading='lazy';img.onerror=()=>v.replaceChildren(node('span','placeholder','🎁'));v.append(img)}else v.append(node('span','placeholder','🎁'));card.append(v);let b=node('div','card-body');b.append(node('h2','',tr(p.name_ja,p.name_en)||p.id),node('p','muted',tr(p.description_ja,p.description_en)||''));let ready=p.status==='published'&&safeURL(p.checkout_url||'');b.append(node('div','price',p.price_jpy>0?'¥'+Number(p.price_jpy).toLocaleString('ja-JP'):tr('価格未定','Price TBD')),node('p','note',tr(p.shipping_ja,p.shipping_en)||tr('送料は別途確認','Shipping to be confirmed')));if(ready){let a=node('a','button',tr('購入する','Buy now'));a.href=ready;a.target='_blank';a.rel='noopener noreferrer';b.append(a)}else{let btn=node('button','',tr('近日販売','Coming soon'));btn.disabled=true;b.append(btn)}card.append(b);el('items').append(card)}}el('toggle').onclick=()=>{lang=lang==='ja'?'en':'ja';history.replaceState({},'',location.pathname+'?lang='+lang);render()};fetch('products.json?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{if(!Array.isArray(data))throw Error('invalid');products=data;render()}).catch(()=>{el('status').textContent=tr('商品データがありません。products.jsonを同じフォルダに配置してください。','Product data unavailable. Check products.json.')});
</script></body></html>
