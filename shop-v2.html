<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C.P.A.W.jp | Japanese Goods</title><link rel="stylesheet" href="cpaw-v2.css"></head><body><header><a class="brand" href="index.html" style="text-decoration:none">C.P.A.W.jp</a><div class="actions"><a href="index.html" class="small" id="home">HOME</a><button class="secondary" id="toggle" type="button">EN / 日本語</button></div></header><main class="wrap"><span class="pill">CURATED FROM JAPAN</span><h1 id="headline">日本から、世界へ。</h1><p class="muted" id="intro">日本の商品を世界中へ。商品代金と海外送料は別です。</p><div id="status" class="notice topgap">商品データを読み込んでいます…</div><section id="items" class="grid topgap" aria-live="polite"></section></main><script>
const $=id=>document.getElementById(id);let lang=new URLSearchParams(location.search).get('lang')==='en'?'en':'ja',products=[];
const tr=(ja,en)=>lang==='ja'?ja:en;
function safeUrl(url){try{const u=new URL(url,location.href);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}}
function node(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function render(){document.documentElement.lang=lang;$('headline').textContent=tr('日本から、世界へ。','A little Japan, delivered worldwide.');$('intro').textContent=tr('日本の商品を世界中へ。商品代金と海外送料は別です。','Discover Japanese goods. International shipping is charged separately.');$('toggle').textContent=lang==='ja'?'English':'日本語';$('home').textContent=tr('トップへ','Home');$('items').replaceChildren();const active=products.filter(p=>p.status==='published');$('status').textContent=active.length?tr(`${active.length}点の商品を掲載中`,`Showing ${active.length} product(s)`):tr('公開中の商品はまだありません。管理画面で公開設定をしてください。','No published products yet. Publish products from the admin page.');for(const p of active){const c=node('article','card');const v=node('div','visual');const imgurl=safeUrl(p.image_url||'');if(imgurl){const img=node('img');img.src=imgurl;img.alt=tr(p.name_ja,p.name_en)||'';img.loading='lazy';img.onerror=()=>v.replaceChildren(node('div','placeholder','🎁'));v.append(img)}else v.append(node('div','placeholder','🎁'));c.append(v);const b=node('div','card-body');b.append(node('h2','',tr(p.name_ja,p.name_en)||p.id),node('p','muted',tr(p.description_ja,p.description_en)||''),node('div','price',`¥${Number(p.price_jpy||0).toLocaleString('ja-JP')}`),node('p','note',tr(p.shipping_ja,p.shipping_en)||tr('海外送料別','Shipping calculated separately')));const link=safeUrl(p.checkout_url||'');if(link){const a=node('a','button',tr('購入する / BUY NOW','BUY NOW'));a.href=link;a.rel='noopener noreferrer';a.target='_blank';b.append(a)}else{const btn=node('button','',tr('準備中','Coming soon'));btn.disabled=true;b.append(btn)}c.append(b);$('items').append(c)}}
$('toggle').onclick=()=>{lang=lang==='ja'?'en':'ja';history.replaceState({},'',location.pathname+'?lang='+lang);render()};fetch('products.json?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(a=>{if(!Array.isArray(a))throw Error('Invalid products.json');products=a;render()}).catch(e=>{$('status').textContent=tr('商品データを読み込めません。GitHub Pagesで開き、products.jsonが同じフォルダにあるか確認してください。','Unable to load products.json. Open via GitHub Pages and check that the file exists.');console.error(e)});
</script></body></html>
