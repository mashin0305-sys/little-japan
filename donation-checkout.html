<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#00291e"><title>Support C.P.A.W.jp</title><style>
:root{--green:#00291e;--gold:#e9c77f;--cream:#f7f1e5}*{box-sizing:border-box}body{margin:0;background:var(--green);color:var(--cream);font-family:Georgia,'Noto Serif JP',serif;line-height:1.7}main{max-width:660px;margin:auto;padding:28px 20px 72px}header{display:flex;justify-content:space-between;align-items:center}a{color:var(--gold)}.logo{text-decoration:none;font-size:22px;letter-spacing:.1em}.lang button{background:none;border:0;color:var(--cream);font-size:14px;padding:8px;cursor:pointer}.lang button[aria-pressed=true]{color:var(--gold);text-decoration:underline}h1{font-weight:400;font-size:clamp(28px,6vw,46px);margin:65px 0 14px}.lead{color:#e1dbce}.panel{margin-top:30px;padding:24px;border:1px solid #bba36a66;border-radius:18px;background:#ffffff0b}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.amount{padding:17px 8px;background:#ffffff08;border:1px solid #a88e5b;border-radius:12px;color:var(--cream);font-size:18px;cursor:pointer}.amount[aria-pressed=true]{background:var(--gold);color:var(--green);font-weight:bold}.custom{display:block;margin-top:20px}.custom input{width:100%;padding:15px;background:#f9f4ea;border:2px solid transparent;border-radius:10px;font-size:18px;margin-top:8px}.custom input:focus{outline:2px solid var(--gold)}.submit{width:100%;padding:18px;background:var(--gold);border:0;border-radius:40px;font-size:17px;font-weight:bold;color:var(--green);margin-top:24px;cursor:pointer}.submit:disabled{opacity:.45;cursor:not-allowed}.small{font-size:13px;color:#d2d3c9}.error{color:#ffbcb2;min-height:24px}.summary{font-size:24px;color:var(--gold)}footer{margin-top:42px;border-top:1px solid #ffffff33;padding-top:20px;font-size:13px;color:#ddd} [hidden]{display:none!important}
</style></head><body><main><header><a class="logo" href="donate.html">C.P.A.W.jp</a><div class="lang"><button id="ja" aria-pressed="true">JP</button><span>|</span><button id="en" aria-pressed="false">EN</button></div></header><h1 data-i18n="heading">日本の日常を、世界の日常へ。</h1><p class="lead" data-i18n="lead">日本の商品や文化を世界に届ける活動を、あなたの支援で前に進めます。</p><section class="panel"><h2 data-i18n="choose">支援金額を選択</h2><div class="choices" id="choices"><button class="amount" data-amount="500" aria-pressed="false">¥500</button><button class="amount" data-amount="1000" aria-pressed="true">¥1,000</button><button class="amount" data-amount="3000" aria-pressed="false">¥3,000</button><button class="amount" data-amount="5000" aria-pressed="false">¥5,000</button></div><label class="custom" for="custom" data-i18n="custom">その他の金額（日本円）</label><input id="custom" type="number" inputmode="numeric" min="500" max="100000" step="1" placeholder="例：10000"><p class="small" data-i18n="range">500円〜100,000円・一回限りの支援です。</p><p data-i18n="total">支援金額</p><div class="summary" id="total" aria-live="polite">¥1,000</div><p class="small" data-i18n="disclaimer">ご支援は任意です。商品・返礼品はありません。支援金は活動紹介動画、Webサイト制作、多言語対応、海外への情報発信に活用します。</p><button class="submit" id="pay" disabled data-i18n="notready">決済準備中</button><p class="small" id="status" data-i18n="status">安全な本番決済の接続が完了するまで、お支払いは受け付けません。</p><p class="error" id="error" role="alert"></p></section><footer><p data-i18n="footer">決済前に運営者情報・プライバシーポリシー・返金方針をご確認ください。</p><a href="donate.html" data-i18n="back">募金サイトに戻る</a></footer></main><script src="donation-config.js"></script><script>
(()=>{'use strict';const t={ja:{heading:'日本の日常を、世界の日常へ。',lead:'日本の商品や文化を世界に届ける活動を、あなたの支援で前に進めます。',choose:'支援金額を選択',custom:'その他の金額（日本円）',range:'500円〜100,000円・一回限りの支援です。',total:'支援金額',disclaimer:'ご支援は任意です。商品・返礼品はありません。支援金は活動紹介動画、Webサイト制作、多言語対応、海外への情報発信に活用します。',notready:'決済準備中',pay:'支援手続きへ進む',status:'安全な本番決済の接続が完了するまで、お支払いは受け付けません。',ready:'次の画面で決済内容をご確認ください。',footer:'決済前に運営者情報・プライバシーポリシー・返金方針をご確認ください。',back:'募金サイトに戻る',invalid:'500円から100,000円までの整数で入力してください。',failed:'決済画面を開けませんでした。時間をおいてお試しください。'},en:{heading:'Bringing Everyday Japan to the World.',lead:'Support our work to introduce Japanese products and culture to people around the world.',choose:'Choose your support amount',custom:'Other amount (JPY)',range:'JPY 500–100,000. One-time contribution only.',total:'Your contribution',disclaimer:'Contributions are voluntary. No products or rewards are provided. Funds support cultural videos, website development, translations and international outreach.',notready:'Payments coming soon',pay:'Continue to secure checkout',status:'We are not accepting payments until secure live checkout is connected.',ready:'Review your payment details on the next screen.',footer:'Please review operator information, privacy policy and refund policy before payment.',back:'Back to support page',invalid:'Enter a whole amount from JPY 500 to 100,000.',failed:'Unable to open checkout. Please try again later.'}};let lang='ja',amount=1000;const $=id=>document.getElementById(id),config=window.CPAW_DONATION_CONFIG||{},enabled=typeof config.apiUrl==='string'&&/^https:\/\//.test(config.apiUrl);function render(){document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(e=>{e.textContent=t[lang][e.dataset.i18n]});$('ja').setAttribute('aria-pressed',String(lang==='ja'));$('en').setAttribute('aria-pressed',String(lang==='en'));$('total').textContent=Number.isInteger(amount)&&amount>=500&&amount<=100000?'¥'+amount.toLocaleString('ja-JP'):'—';const valid=Number.isInteger(amount)&&amount>=500&&amount<=100000;$('pay').disabled=!enabled||!valid;$('pay').textContent=t[lang][enabled?'pay':'notready'];$('status').textContent=t[lang][enabled?'ready':'status'];$('error').textContent=valid?'':t[lang].invalid;document.querySelectorAll('[data-amount]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.amount)===amount&&$('custom').value==='')))}$('ja').onclick=()=>{lang='ja';render()};$('en').onclick=()=>{lang='en';render()};document.querySelectorAll('[data-amount]').forEach(b=>b.onclick=()=>{amount=Number(b.dataset.amount);$('custom').value='';render()});$('custom').addEventListener('input',e=>{amount=e.target.value===''?NaN:Number(e.target.value);render()});$('pay').onclick=async()=>{if(!enabled||!Number.isInteger(amount)||amount<500||amount>100000)return;$('pay').disabled=true;$('error').textContent='';try{const response=await fetch(config.apiUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amountJPY:amount,currency:'jpy',kind:'donation',locale:lang})});if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();if(typeof data.url!=='string'||!/^https:\/\/checkout\.stripe\.com\//.test(data.url))throw Error('Invalid checkout URL');location.assign(data.url)}catch(e){$('error').textContent=t[lang].failed;$('pay').disabled=false}};render()})();
</script></body></html>
