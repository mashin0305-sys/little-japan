<script>
(()=>{
const cards=[...document.querySelectorAll('.card')],track=document.getElementById('track'),total=cards.length;
let phase=0,last=0,dragging=false,lastX=0,velocity=0,resumeAt=0;
function render(){for(let i=0;i<total;i++){let p=(i-2+phase+total*20)%total;if(p>total/2)p-=total;const a=Math.abs(p),c=cards[i];c.style.transform=`translate(-50%,-50%) translateX(${p*116}%) scale(${1.1-.16*a})`;c.style.opacity=1-.11*a;c.style.zIndex=10-Math.round(a*2);c.style.filter=`brightness(${1-.07*a}) drop-shadow(0 5px 8px #0006)`;}}
render();function frame(t){if(!last)last=t;const dt=Math.min(t-last,50);last=t;if(!dragging){if(Math.abs(velocity)>.00001){phase=(phase+velocity*dt+total*100)%total;velocity*=Math.pow(.92,dt/16.67)}else if(t>resumeAt){phase=(phase+dt/10000)%total}render()}requestAnimationFrame(frame)}requestAnimationFrame(frame);
track.style.touchAction='pan-y';track.addEventListener('pointerdown',e=>{dragging=true;velocity=0;lastX=e.clientX;track.setPointerCapture?.(e.pointerId)});track.addEventListener('pointermove',e=>{if(!dragging)return;const move=-(e.clientX-lastX)/145;lastX=e.clientX;phase=(phase+move+total*100)%total;velocity=move/16.67;render()});function release(){if(!dragging)return;dragging=false;resumeAt=performance.now()+1000}track.addEventListener('pointerup',release);track.addEventListener('pointercancel',release);document.addEventListener('visibilitychange',()=>{last=0});
})();
