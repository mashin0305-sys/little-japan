<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C.P.A.W.jp | 商品管理</title><link rel="stylesheet" href="cpaw-v2.css"></head><body><header><a class="brand" href="index.html">C.P.A.W.jp / 商品管理</a><a href="shop-v2.html">ショップを見る ↗</a></header><main class="wrap"><h1>商品管理（日本語）</h1><p class="muted">商品を編集 →「商品データを書き出す」→ ダウンロードした products.json を GitHub の同名ファイルと置き換えるだけ。</p><div class="notice">この管理画面は公開されており、ログイン保護はありません。編集内容は自分の端末に一時保存され、<strong>書き出してGitHubにアップロードするまで公開されません。</strong> パスワードや秘密のAPIキーは入力しないでください。</div><div class="actions topgap"><button id="export">商品データを書き出す</button><button id="import" class="secondary">ファイルから読み込む</button><input id="file" type="file" accept=".json,application/json" hidden><button id="live" class="secondary">公開データを読み込む</button><button id="new" class="secondary">新しい商品を追加</button></div><p class="warning" id="message" role="status"></p><div class="layout topgap"><section class="panel"><h2>商品の編集</h2><form id="form"><div class="two"><div><label for="id">商品コード</label><input id="id" required placeholder="CPAW-001"></div><div><label for="statusfield">公開設定</label><select id="statusfield"><option value="draft">非公開</option><option value="coming_soon">近日販売</option><option value="published">公開</option></select></div></div><label for="name_ja">商品名（日本語）</label><input id="name_ja" required><label for="name_en">商品名（英語・任意）</label><input id="name_en"><label for="description_ja">商品説明（日本語）</label><textarea id="description_ja"></textarea><label for="description_en">商品説明（英語・任意）</label><textarea id="description_en"></textarea><div class="two"><div><label for="price_jpy">販売価格（円）</label><input id="price_jpy" type="number" min="0" value="0"></div><div><label for="image_url">商品画像URL（https://）</label><input id="image_url" placeholder="https://..."></div></div><label for="checkout_url">決済リンク（準備できるまで空欄）</label><input id="checkout_url" placeholder="https://..."><div class="two"><div><label for="shipping_ja">配送案内（日本語）</label><input id="shipping_ja"></div><div><label for="shipping_en">配送案内（英語）</label><input id="shipping_en"></div></div><div class="actions topgap"><button type="submit">この商品を保存</button><button type="button" id="remove" class="danger">この商品を削除</button></div></form></section><aside class="panel"><h2>登録した商品</h2><div id="list"></div></aside></div></main><script>
const fields=['id','name_ja','name_en','description_ja','description_en','price_jpy','image_url','checkout_url','shipping_ja','shipping_en'];let products=[],selected=-1;const $=id=>document.getElementById(id);const say=s=>$('message').textContent=s;function persist(){localStorage.setItem('cpaw_admin_products',JSON.stringify(products))}function draw(){let list=$('list');list.replaceChildren();products.forEach((p,i)=>{let row=document.createElement('div');row.className='listrow';let label=document.createElement('strong');label.textContent=(i+1)+'. '+(p.name_ja||p.id||'未入力')+' ['+({draft:'非公開',published:'公開',coming_soon:'近日販売'}[p.status]||p.status)+']';row.append(label);let edit=document.createElement('button');edit.textContent='編集';edit.className='secondary';edit.onclick=()=>choose(i);row.append(edit);for(let [txt,dir] of [['↑',-1],['↓',1]]){let b=document.createElement('button');b.textContent=txt;b.className='secondary';b.disabled=i+dir<0||i+dir>=products.length;b.onclick=()=>{[products[i],products[i+dir]]=[products[i+dir],products[i]];persist();draw();choose(i+dir)};row.append(b)}list.append(row)});if(!products.length)list.textContent='まだ商品がありません。'}function choose(i){selected=i;let p=products[i]||{};fields.forEach(k=>$(k).value=p[k]??'');$('statusfield').value=p.status||'draft';say('編集中：'+(p.name_ja||'新しい商品'))}function blank(){selected=-1;$('form').reset();$('statusfield').value='draft';$('price_jpy').value='0';say('新しい商品を入力してください。')}function validURL(v){if(!v)return true;try{let u=new URL(v);return ['http:','https:'].includes(u.protocol)}catch{return false}}$('form').onsubmit=e=>{e.preventDefault();let p={};fields.forEach(k=>p[k]=$(k).value.trim());p.price_jpy=Math.max(0,Number(p.price_jpy)||0);p.status=$('statusfield').value;if(!p.id||!p.name_ja)return say('商品コードと商品名は必須です。');if(!validURL(p.image_url)||!validURL(p.checkout_url))return say('画像・決済URLはhttpまたはhttpsで入力してください。');if(products.some((x,i)=>i!==selected&&x.id===p.id))return say('同じ商品コードが登録されています。');if(selected<0){products.push(p);selected=products.length-1}else products[selected]=p;persist();draw();say('保存しました。公開には「商品データを書き出す」が必要です。')};$('new').onclick=blank;$('remove').onclick=()=>{if(selected<0)return say('削除する商品を選んでください。');if(!confirm('この商品を削除しますか？'))return;products.splice(selected,1);persist();draw();blank()};$('export').onclick=()=>{let blob=new Blob([JSON.stringify(products,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='products.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);say('products.jsonを書き出しました。GitHubへアップロードしてください。')};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data))throw Error();products=data;persist();draw();choose(0);say('ファイルを読み込みました。')}catch{say('読み込めませんでした。正しいJSONファイルを選んでください。')}};$('live').onclick=()=>{if(!confirm('端末に保存した編集中データを公開データで上書きしますか？'))return;fetch('products.json?ts='+Date.now()).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{if(!Array.isArray(d))throw Error();products=d;persist();draw();choose(0);say('公開データを読み込みました。')}).catch(()=>say('公開データを読み込めません。GitHub Pagesから開いてください。'))};try{products=JSON.parse(localStorage.getItem('cpaw_admin_products')||'[]');if(!Array.isArray(products))products=[]}catch{products=[]}draw();if(products.length)choose(0);else fetch('products.json').then(r=>r.json()).then(d=>{if(Array.isArray(d)&&!products.length){products=d;persist();draw();choose(0)}}).catch(()=>blank());
</script></body></html>
