<section id="products"><h1 id="heading">Discover Japanese Products</h1>
<p id="intro">日本のいいものを、世界の日常へ。</p><div class="products" id="productCards"></div>
<p style="font-size:13px;color:#c3b18d;margin-top:25px">※ 現在は紹介用のデモサイトです。決済・注文受付はまだ対応していません。</p></section>
<footer>Connecting People Around the World with Japanese Products</footer>
<div class="panel" id="overlay" role="dialog" aria-modal="true"><div class="inner"><button class="close" aria-label="Close" onclick="hide()">×</button><div id="panelBody"></div></div></div>
<script>
const items=[['🍵','Japanese Ceramics','日本の器'],['🫖','Japanese Teapot','日本の急須'],['🔴','Daruma Doll','だるま'],['🪵','Wooden Masu','木製の枡'],['🪭','Japanese Folding Fan','扇子'],['🥢','Japanese Chopsticks','お箸']];
let locale='en';
function render(){document.getElementById('heading').textContent=locale==='ja'?'日本の商品を見る':'Discover Japanese Products';document.getElementById('intro').textContent=locale==='ja'?'日本のいいものを、世界の日常へ。':'Bringing the best of Japan to everyday life around the world.';document.getElementById('productCards').innerHTML=items.map((p,i)=>`<article class="product"><div style="font-size:36px">${p[0]}</div><h3>${locale==='ja'?p[2]:p[1]}</h3><p>${locale==='ja'?p[1]:p[2]}</p><button class="btn" onclick="openProduct(${i})">${locale==='ja'?'詳しく見る':'Learn more'}</button></article>`).join('')}
function show(which){let content='';if(which==='menu')content='<h2>Menu / メニュー</h2><p><a href="#" onclick="event.preventDefault();showProducts()">Discover Products / 商品を見る →</a></p><p><button class="btn" onclick="show(&quot;language&quot;)">Language / 言語</button></p>';if(which==='cart')content='<h2>Shopping Cart / カート</h2><p>オンライン注文は準備中です。<br>Online ordering is coming soon.</p>';if(which==='language')content='<h2>Language / 言語</h2><button class="btn" onclick="setLang(&quot;ja&quot;)">日本語</button>　<button class="btn" onclick="setLang(&quot;en&quot;)">English</button>';document.getElementById('panelBody').innerHTML=content;document.getElementById('overlay').classList.add('open')}
function hide(){document.getElementById('overlay').classList.remove('open')}
function setLang(l){locale=l;render();hide()}
function showProducts(){document.getElementById('panelBody').innerHTML='<h2>Japanese Products / 日本の商品</h2>'+items.map((p,i)=>`<p><button class="btn" onclick="openProduct(${i})">${p[0]} ${p[1]} / ${p[2]}</button></p>`).join('');document.getElementById('overlay').classList.add('open')}
function openProduct(i){const p=items[i];document.getElementById('panelBody').innerHTML=`<div style="font-size:54px">${p[0]}</div><h2>${p[1]}</h2><p>${p[2]}</p><p>商品情報・価格・配送方法は準備中です。<br>Product details, pricing and shipping are coming soon.</p>`;document.getElementById('overlay').classList.add('open')}
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')hide()});document.addEventListener('keydown',e=>{if(e.key==='Escape')hide()});render();

(function(){
const track=document.querySelector('.carousel-track');
const strip=document.querySelector('.carousel-strip');
let offset=0,previous=0,paused=false;
strip.addEventListener('touchstart',()=>{paused=true},{passive:true});
strip.addEventListener('touchend',()=>{paused=false},{passive:true});
strip.addEventListener('mouseenter',()=>{paused=true});
strip.addEventListener('mouseleave',()=>{paused=false});
function tick(time){
 if(previous){let dt=Math.min((time-previous)/1000,0.05);
  if(!paused){const half=track.scrollWidth/2;offset+=Math.max(20,strip.clientWidth*0.095)*dt;if(half>0&&offset>=half)offset-=half;track.style.transform='translate3d('+(-offset)+'px,0,0)';}
 }
 previous=time;requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
})();
</script></body></html>
